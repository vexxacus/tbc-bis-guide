name: Refresh PvP Data

on:
  # Kör varje söndag kl 03:00 UTC
  schedule:
    - cron: '0 3 * * 0'
  # Tillåt manuell körning från Actions-fliken
  workflow_dispatch:
    inputs:
      top:
        description: 'Antal spelare att analysera (default: 500)'
        required: false
        default: '500'

jobs:
  refresh:
    name: Fetch & Analyze PvP BiS Data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Fetch leaderboard
        run: node scraper/fetch-leaderboard.js

      - name: Fetch gear data
        run: node scraper/fetch-gear.js --top ${{ github.event.inputs.top || '500' }} --delay 800

      - name: Analyze gear
        run: node scraper/analyze-gear.js

      - name: Convert to js/pvp-data.js
        run: |
          node -e "
            const data = require('./scraper/output/pvp-bis-data.json');
            const output = 'const PVP_DATA = ' + JSON.stringify(data) + ';';
            require('fs').writeFileSync('js/pvp-data.js', output, 'utf-8');
            console.log('Written js/pvp-data.js:', (output.length/1024).toFixed(1), 'KB');
            console.log('Specs:', Object.keys(data.specs).length);
            console.log('Players analyzed:', data.meta.totalPlayers);
            console.log('Analyzed at:', data.meta.analyzedAt);
          "

      - name: Update PvP meta history (append this week's snapshot)
        run: node build-pvp-history.js

      # Keep every PvP page in sitemap.xml alive: if a rare spec (e.g. Enhancement
      # Shaman) dropped below the sample threshold this week, splice in its most
      # recent snapshot from pvp-history.json, tagged stale. Runs AFTER history so
      # the revived data never pollutes the meta-evolution timeline.
      - name: Apply PvP fallback (revive specs below sample threshold)
        run: node apply-pvp-fallback.js

      # New PvP items each week need their Wowhead icon + gem-socket data, or they
      # render as a red questionmark with no gems (e.g. the Season 2 "Merciless
      # Gladiator" pieces). Both scripts are cache-backed (only new IDs hit the
      # network) and read js/pvp-data.js, so this is cheap on a normal week.
      - name: Refresh PvP item icons & sockets
        run: |
          node fetch-sockets.js
          node fetch-icons.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet js/pvp-data.js js/icons.js js/item-sockets.js pvp-history.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Bust JS caches
        if: steps.changes.outputs.changed == 'true'
        run: |
          # js files are served immutable (max-age=1y), so a content change is invisible
          # to returning visitors unless the ?v= query string also changes. Bump all
          # three data files to this week's refresh date.
          V=$(date -u '+%Y%m%d')
          sed -i -E "s#(/js/pvp-data\.js\?v=)[^\"']+#\1$V#" index.html
          sed -i -E "s#(/js/icons\.js\?v=)[^\"']+#\1$V#" index.html
          sed -i -E "s#(/js/item-sockets\.js\?v=)[^\"']+#\1$V#" index.html

      - name: Commit & push updated PvP data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Cache files (.icon-cache.json/.socket-cache.json) ride along so the next
          # weekly run only fetches genuinely-new item IDs instead of cold-fetching
          # thousands from Wowhead.
          git add js/pvp-data.js js/icons.js js/item-sockets.js pvp-history.json index.html .icon-cache.json .socket-cache.json
          git commit -m "chore: auto-refresh PvP BiS data $(date -u '+%Y-%m-%d')"
          git push

      - name: Deploy to Firebase
        if: steps.changes.outputs.changed == 'true'
        run: npx firebase-tools deploy --only hosting --project tbc-bis-guide --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "PvP data unchanged — skipping commit."
